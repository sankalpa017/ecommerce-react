<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">

      function ProductDetails({name, price, discountPrice, imgSrc}) {
        return (
          <div>
            <img src={imgSrc} width="150"/>
            <p>{name}</p>
            {discountPrice ? (
              <>
                <p><del>Price: ${price}</del></p>
                <p>Discount Price: ${discountPrice}</p>
              </>
            ) : (
              <p>Price: ${price}</p>
            )}
            <button>Add to Cart</button>
          </div>
        )
      }      

      function App() {
        return(
          <>
            <ProductDetails 
              name="Cotton socks" 
              price="10.90"
              imgSrc = "cotton-socks.png"
              discountPrice="5.45"
            />
            <ProductDetails 
              name="Tennis balls" 
              price="6.00" 
              imgSrc="tennis-balls.png"
            />
            <ProductDetails 
              name="Plain T-shirt" 
              price="7.99" 
              imgSrc="plain-t-shirt.png"
            />
          </>
        )
      }

      const container = document.querySelector('.js-container');
      const root = ReactDOM.createRoot(container);  
      root.render(<App />)
    </script>
  </body>
</html>
